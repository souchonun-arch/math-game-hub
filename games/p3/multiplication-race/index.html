<title>乘法對戰賽跑 · 口訣大比拼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --p1:#ff8a50; --p1d:#e64a19; --p1soft:#fff0e8;
    --p2:#42a5f5; --p2d:#1565c0; --p2soft:#e6f2ff;
    --ink:#3e2723; --gold:#ffca28;
  }
  html,body{ height:100%; }
  body{
    font-family:"PingFang HK","Microsoft JhengHei","Heiti TC",sans-serif;
    background:linear-gradient(160deg,#fff4e6,#ffe8f0 45%,#e6f4ff);
    color:var(--ink); overflow:hidden; user-select:none;
  }
  #app{ height:100vh; display:flex; flex-direction:column; position:relative; }

  .btn{ border:none; border-radius:999px; cursor:pointer; font-family:inherit; font-weight:800;
    background:var(--gold); color:var(--ink); padding:15px 46px; font-size:23px;
    box-shadow:0 6px 0 #e0a800; transition:transform .08s,box-shadow .08s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #e0a800; }

  /* ===== 開始畫面 ===== */
  #start{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; padding:20px; }
  #start h1{ font-size:clamp(38px,7vw,74px); color:var(--p1d);
    text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(0,0,0,.08); letter-spacing:2px; }
  #start .sub{ font-size:19px; color:#8d6e63; margin-top:-6px; }
  .vs-preview{ display:flex; align-items:center; gap:24px; }
  .vs-preview img{ width:130px; filter:drop-shadow(3px 6px 6px rgba(0,0,0,.2)); animation:bob 2s ease-in-out infinite; }
  .vs-preview img:nth-child(3){ animation-delay:.5s; }
  .vs-badge{ font-size:44px; font-weight:900; color:var(--gold); text-shadow:2px 2px 0 var(--p1d); }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-12px) rotate(3deg);} }
  .settings{ background:#fff; border-radius:24px; padding:22px 30px; box-shadow:0 12px 30px rgba(0,0,0,.1);
    display:flex; flex-direction:column; gap:16px; min-width:330px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:18px; font-size:18px; font-weight:700; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ border:3px solid #ffcc80; background:#fff; color:var(--ink); border-radius:14px;
    padding:8px 15px; font-size:16px; font-weight:800; cursor:pointer; transition:.15s; }
  .chip.on{ background:var(--gold); border-color:#e0a800; }
  .hint{ font-size:14px; color:#a1887f; max-width:520px; line-height:1.7; }

  /* ===== 對戰畫面 ===== */
  #game{ flex:1; display:none; flex-direction:column; }
  #game.show{ display:flex; }
  .topbar{ display:flex; align-items:center; justify-content:center; gap:14px; padding:6px; background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.06); font-weight:800; z-index:5; }
  .score{ font-size:17px; } .score.p1{ color:var(--p1d);} .score.p2{ color:var(--p2d);}
  .mini{ background:#fff3e0; border:none; border-radius:10px; padding:6px 14px; font-weight:800; cursor:pointer; font-family:inherit; }
  .audio-toggle{ background:#e8f5e9; color:#2e7d32; border:none; border-radius:10px; padding:6px 12px; font-weight:900; cursor:pointer; font-family:inherit; }
  .audio-toggle.off{ background:#eeeeee; color:#757575; }

  .track-area{ flex:1; display:flex; position:relative; }
  .lane{ flex:1; display:flex; flex-direction:column; position:relative; padding:12px; gap:10px; transition:background .3s; overflow:hidden; }
  .lane.p1{ background:var(--p1soft);} .lane.p2{ background:var(--p2soft);}
  .lane.shake{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-10px);} 40%{transform:translateX(10px);} 60%{transform:translateX(-7px);} 80%{transform:translateX(7px);} }

  .lane .tag{ font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; }
  .lane.p1 .tag{ color:var(--p1d);} .lane.p2 .tag{ color:var(--p2d);}

  /* 跑道 */
  .runway{ position:relative; height:100px; border-radius:16px; overflow:hidden;
    background:repeating-linear-gradient(90deg,#e8f5e9 0 40px,#dcedc8 40px 80px);
    border:3px dashed #a5d6a7; }
  .runway::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:16px;
    background:repeating-linear-gradient(45deg,#333 0 8px,#fff 8px 16px); opacity:.7; }
  /* 角色外層負責「移動」，內層負責「持續奔跑動作」，兩者分離互不干擾 */
  .runner{ position:absolute; bottom:4px; left:0; width:92px; transition:left .5s cubic-bezier(.34,1.56,.64,1); z-index:2; }
  .runner img{ width:100%; display:block; filter:drop-shadow(2px 3px 3px rgba(0,0,0,.25));
    animation:runcycle .45s ease-in-out infinite; transform-origin:bottom center; }
  /* 持續奔跑：上下彈跳 + 前傾晃動 */
  @keyframes runcycle{
    0%   { transform:translateY(0)    rotate(-4deg) scaleX(1); }
    25%  { transform:translateY(-10px) rotate(-1deg) scaleX(1.02); }
    50%  { transform:translateY(0)    rotate(-4deg) scaleX(1); }
    75%  { transform:translateY(-6px) rotate(-7deg) scaleX(.98); }
    100% { transform:translateY(0)    rotate(-4deg) scaleX(1); }
  }
  /* 衝刺（答對瞬間）跑更快 */
  .runner.sprint img{ animation-duration:.22s; }
  /* 答對大跳 */
  .runner.hop img{ animation:hop .5s; }
  @keyframes hop{ 0%{transform:translateY(0) scale(1);} 40%{transform:translateY(-30px) rotate(-6deg) scale(1.12,.9);} 100%{transform:translateY(0) scale(1);} }
  /* 被冰凍/龍捲風暈眩 */
  .runner.dizzy img{ animation:dizzy .8s infinite; }
  @keyframes dizzy{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-18deg);} 75%{transform:rotate(18deg);} }
  /* 香蕉滑倒 */
  .runner.slip img{ animation:slip .7s; }
  @keyframes slip{ 0%{transform:rotate(0);} 50%{transform:rotate(-80deg) translateY(12px);} 100%{transform:rotate(0);} }
  /* 灰塵 */
  .dust{ position:absolute; bottom:6px; font-size:20px; opacity:.7; z-index:1; animation:dustpuff .5s ease-out infinite; }
  @keyframes dustpuff{ 0%{opacity:.6; transform:translateX(0) scale(.8);} 100%{opacity:0; transform:translateX(-16px) scale(1.3);} }

  .progress-pct{ position:absolute; top:4px; right:22px; font-size:13px; font-weight:800; color:#558b2f; background:rgba(255,255,255,.7); padding:1px 8px; border-radius:8px; }

  /* 能量條 */
  .energy-wrap{ display:flex; align-items:center; gap:8px; }
  .energy-label{ font-size:13px; font-weight:800; white-space:nowrap; }
  .energy{ flex:1; height:20px; background:#fff; border-radius:999px; overflow:hidden; border:2px solid rgba(0,0,0,.08); position:relative; }
  .energy-fill{ height:100%; width:0%; border-radius:999px; transition:width .4s; }
  .lane.p1 .energy-fill{ background:linear-gradient(90deg,#ffb74d,#ff7043);} 
  .lane.p2 .energy-fill{ background:linear-gradient(90deg,#4fc3f7,#1976d2);} 
  .energy.full .energy-fill{ animation:epulse .6s infinite; }
  @keyframes epulse{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.35);} }
  .power-btn{ border:none; border-radius:12px; padding:8px 12px; font-size:14px; font-weight:900; font-family:inherit;
    cursor:pointer; color:#fff; background:#bdbdbd; white-space:nowrap; transition:.15s; }
  .power-btn.ready{ background:linear-gradient(90deg,#ffca28,#ff7043); animation:glow 1s infinite; }
  @keyframes glow{ 0%{box-shadow:0 0 0 0 rgba(255,152,0,.6);} 70%{box-shadow:0 0 0 12px rgba(255,152,0,0);} 100%{box-shadow:0 0 0 0 rgba(255,152,0,0);} }

  /* combo */
  .combo{ position:absolute; top:44px; left:50%; transform:translateX(-50%); font-size:26px; font-weight:900;
    opacity:0; pointer-events:none; z-index:6; }
  .lane.p1 .combo{ color:var(--p1d);} .lane.p2 .combo{ color:var(--p2d);}
  .combo.show{ animation:comboPop .8s; }
  @keyframes comboPop{ 0%{opacity:0; transform:translateX(-50%) scale(.3);} 30%{opacity:1; transform:translateX(-50%) scale(1.3);} 100%{opacity:0; transform:translateX(-50%) scale(1) translateY(-30px);} }

  /* 題目 */
  .q{ background:#fff; border-radius:20px; padding:14px; text-align:center; box-shadow:0 6px 16px rgba(0,0,0,.08);
    flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; position:relative; }
  .q .expr{ font-size:clamp(38px,8vw,74px); font-weight:900; }
  .lane.p1 .q .expr{ color:var(--p1d);} .lane.p2 .q .expr{ color:var(--p2d);}
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt{ border:none; border-radius:16px; padding:16px; font-size:28px; font-weight:900; cursor:pointer;
    color:#fff; font-family:inherit; box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .06s,box-shadow .06s; }
  .opt:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .lane.p1 .opt{ background:var(--p1);} .lane.p2 .opt{ background:var(--p2);}
  .opt .key{ display:inline-block; font-size:14px; opacity:.85; margin-right:8px; background:rgba(255,255,255,.25); border-radius:8px; padding:2px 8px; }
  .opt.wrong{ background:#9e9e9e !important; }

  .divider{ width:6px; background:linear-gradient(#ffca28,#ff7043,#42a5f5); z-index:3; }

  /* 干擾特效遮罩 */
  .fx{ position:absolute; inset:0; pointer-events:none; z-index:8; display:none; }
  .fx.show{ display:block; }
  .fx-ink{ position:absolute; inset:0; background:radial-gradient(circle at 30% 35%,#222 0 22%,transparent 60%),radial-gradient(circle at 70% 55%,#111 0 26%,transparent 62%),radial-gradient(circle at 45% 80%,#000 0 22%,transparent 58%); opacity:.92; animation:inkIn .3s; }
  @keyframes inkIn{ from{opacity:0; transform:scale(.5);} to{opacity:.92; transform:scale(1);} }
  .fx .txt{ position:absolute; top:42%; left:0; right:0; text-align:center; font-size:28px; font-weight:900; }
  .fx-ink .txt{ color:#fff; }
  .fx-freeze{ position:absolute; inset:0; background:linear-gradient(rgba(179,229,252,.5),rgba(129,212,250,.62)); }
  .fx-freeze .txt{ color:#0277bd; text-shadow:0 0 8px #fff; }
  .fx-freeze .ice{ position:absolute; font-size:40px; }
  .fx-storm .txt{ color:#4e342e; }

  /* 倒數 / 結束 */
  #count{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; background:rgba(255,249,242,.85); }
  #count.show{ display:flex; }
  #count .num{ font-size:170px; font-weight:900; color:var(--p1d); animation:cd 1s infinite; }
  @keyframes cd{ 0%{transform:scale(1.6); opacity:0;} 40%{transform:scale(1); opacity:1;} 100%{transform:scale(.7); opacity:0;} }

  #over{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:50; }
  #over.show{ display:flex; }
  .card{ background:#fff; border-radius:28px; padding:34px 46px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3); animation:pop .4s; }
  @keyframes pop{ 0%{transform:scale(.6); opacity:0;} 100%{transform:scale(1); opacity:1;} }
  .card img{ width:150px; margin-bottom:6px; animation:bob 1.6s ease-in-out infinite; }
  .card h2{ font-size:40px; margin-bottom:4px; }
  .card .who{ font-size:24px; margin-bottom:14px; font-weight:800; }
  .card .stat{ color:#8d6e63; font-size:17px; margin-bottom:20px; }

  .confetti{ position:fixed; top:-10px; z-index:70; pointer-events:none; }
  .particle{ position:absolute; pointer-events:none; z-index:9; font-size:20px; }
</style>

const cfg = { range: 9, laneLen: 15 };
const ENERGY_MAX = 3;      // 答對幾題滿能量（3題即可放大招）
const FREEZE_MS = 2500;    // 冰凍/墨水持續時間

// ===== 音效 =====
let actx = null;
function beep(freq, dur, type="sine", vol=0.18){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sOk   = ()=>{ beep(660,.1,"square"); setTimeout(()=>beep(990,.12,"square"),80); };
const sNo   = ()=> beep(150,.25,"sawtooth",.15);
const sPow  = ()=>{ [300,500,700,900].forEach((f,i)=>setTimeout(()=>beep(f,.12,"square",.2),i*60)); };
const sHit  = ()=> beep(120,.4,"sawtooth",.2);
const sWin  = ()=>{ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.2),i*130)); };
const sCombo= (n)=> beep(700+n*80,.14,"square",.2);

// ===== 刺激背景音樂：瀏覽器 Web Audio 生成，開始遊戲後自動播放 =====
let musicOn = true, musicTimer = null, musicStep = 0;
const musicNotes = [110,110,147,165,147,110,98,110];
function musicTick(){
  if(!musicOn || !actx) return;
  const base = musicNotes[musicStep % musicNotes.length];
  beep(base, .16, "triangle", .055);
  if(musicStep % 4 === 0) beep(base * 2, .12, "square", .025);
  musicStep++;
}
function startMusic(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state === "suspended") actx.resume();
  if(!musicTimer) { musicTick(); musicTimer = setInterval(musicTick, 190); }
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

const $ = id => document.getElementById(id);
const startSec=$("start"), gameSec=$("game"), overBox=$("over"), countBox=$("count");

$("prev1").src=IMG1; $("prev2").src=IMG2;
$("img1").src=IMG1;  $("img2").src=IMG2;

// ===== 玩家狀態 =====
const P = {
  1:{ id:1, pos:0, ans:null, energy:0, combo:0, frozen:false, powerReady:false,
      lane:$("lane1"), run:$("run1"), imgEl:$("img1"), expr:$("expr1"), opts:$("opts1"), score:$("s1"),
      enWrap:$("en1"), enFill:$("enf1"), pw:$("pw1"), comboEl:$("combo1"), fx:$("fx1"),
      pct:$("pct1"), name:"🦅 藍隊郵差", emoji:"🦅", keys:["a","s","d","f"], power:"g", img:IMG1 },
  2:{ id:2, pos:0, ans:null, energy:0, combo:0, frozen:false, powerReady:false,
      lane:$("lane2"), run:$("run2"), imgEl:$("img2"), expr:$("expr2"), opts:$("opts2"), score:$("s2"),
      enWrap:$("en2"), enFill:$("enf2"), pw:$("pw2"), comboEl:$("combo2"), fx:$("fx2"),
      pct:$("pct2"), name:"🔧 棕隊機械師", emoji:"🔧", keys:["j","k","l",";"], power:"h", img:IMG2 },
};
const opp = p => P[p.id===1?2:1];
let running = false;

// ===== 設定 chips =====
$("rangeChips").addEventListener("click", e=>{ if(!e.target.dataset.r) return;
  document.querySelectorAll("#rangeChips .chip").forEach(c=>c.classList.remove("on"));
  e.target.classList.add("on"); cfg.range=+e.target.dataset.r; });
$("lenChips").addEventListener("click", e=>{ if(!e.target.dataset.l) return;
  document.querySelectorAll("#lenChips .chip").forEach(c=>c.classList.remove("on"));
  e.target.classList.add("on"); cfg.laneLen=+e.target.dataset.l; });

// ===== 出題 =====
function makeQ(p){
  const a=2+Math.floor(Math.random()*(cfg.range-1));
  const b=2+Math.floor(Math.random()*(cfg.range-1));
  const correct=a*b, set=new Set([correct]);
  while(set.size<4){
    let d=correct+(Math.floor(Math.random()*13)-6);
    if(d>0 && d!==correct) set.add(d); else set.add(correct+set.size+1);
  }
  const choices=[...set].sort(()=>Math.random()-.5);
  p.ans=correct;
  p.expr.textContent=`${a} × ${b}`;
  p.opts.innerHTML="";
  choices.forEach((c,i)=>{
    const btn=document.createElement("button");
    btn.className="opt";
    btn.innerHTML=`<span class="key">${p.keys[i].toUpperCase()}</span>${c}`;
    btn.dataset.val=c;
    btn.onclick=()=>answer(p,c,btn);
    p.opts.appendChild(btn);
  });
}

// ===== 作答 =====
function answer(p,val,btn){
  if(!running || p.frozen) return;
  if(val===p.ans){
    sOk();
    p.combo++;
    let step = 1 + (p.combo>=3 ? 1 : 0);   // 3連擊起加速：一次前進2格
    p.pos += step;
    showCombo(p, step);
    p.run.classList.remove("hop"); void p.run.offsetWidth; p.run.classList.add("hop","sprint");
    setTimeout(()=>{ p.run.classList.remove("hop"); }, 500);
    setTimeout(()=>{ p.run.classList.remove("sprint"); }, 700);
    burst(p, "💨");
    moveRunner(p);
    // 蓄能
    if(!p.powerReady){
      p.energy = Math.min(ENERGY_MAX, p.energy + 1);
      updateEnergy(p);
      if(p.energy>=ENERGY_MAX) setPowerReady(p);
    }
    updateScore();
    if(p.pos>=cfg.laneLen) return win(p);
    makeQ(p);
  }else{
    sNo(); p.combo=0;
    // 答錯退後一步，但不會跌出起點
    p.pos = Math.max(0, p.pos - 1);
    moveRunner(p);
    updateScore();
    burst(p, "💢");
    p.lane.classList.remove("shake"); void p.lane.offsetWidth; p.lane.classList.add("shake");
    if(btn){ btn.classList.add("wrong"); setTimeout(()=>btn.classList.remove("wrong"),350); }
  }
}

function showCombo(p, step){
  if(p.combo>=2){
    sCombo(p.combo);
    p.comboEl.textContent = (step>1? "⚡加速！" : "") + `${p.combo} 連擊`;
    p.comboEl.classList.remove("show"); void p.comboEl.offsetWidth; p.comboEl.classList.add("show");
  }
}

function moveRunner(p){
  const rw=p.run.parentElement.clientWidth, max=rw-100;
  const ratio=Math.min(1, p.pos/cfg.laneLen);
  p.run.style.left = (ratio*max) + "px";
  p.pct.textContent = Math.round(ratio*100) + "%";
}

function updateScore(){
  P[1].score.textContent=`🦅 藍隊　${Math.min(P[1].pos,cfg.laneLen)} / ${cfg.laneLen}`;
  P[2].score.textContent=`🔧 棕隊　${Math.min(P[2].pos,cfg.laneLen)} / ${cfg.laneLen}`;
}
function updateEnergy(p){ p.enFill.style.width=(p.energy/ENERGY_MAX*100)+"%"; }
function setPowerReady(p){
  p.powerReady=true; p.enWrap.classList.add("full"); p.pw.classList.add("ready");
  p.pw.textContent = "放大招！" + (p.id===1?"G":"H");
  sPow();
}

// ===== 大招：干擾對手 =====
const POWERS = [
  { name:"墨水潑屏", run:inkAttack },
  { name:"急凍卡題", run:freezeAttack },
  { name:"香蕉滑倒", run:bananaAttack },
  { name:"龍捲風", run:stormAttack },
];
function usePower(p){
  if(!running || !p.powerReady) return;
  p.powerReady=false; p.energy=0; updateEnergy(p);
  p.enWrap.classList.remove("full"); p.pw.classList.remove("ready");
  p.pw.textContent = "大招 " + (p.id===1?"G":"H");
  const atk = POWERS[Math.floor(Math.random()*POWERS.length)];
  atk.run(opp(p), p);
}

function freezeTarget(t, ms, cb){
  t.frozen=true;
  setTimeout(()=>{ t.frozen=false; if(cb) cb(); }, ms);
}

function inkAttack(t, from){
  sHit();
  // 墨魚噴墨汁：黑屏停止 2 秒
  t.fx.innerHTML = `<div class="fx-ink"></div><div class="txt">🦑 墨魚噴墨！停止 2 秒</div>`;
  t.fx.classList.add("show");
  freezeTarget(t, 2000, ()=>{ t.fx.classList.remove("show"); t.fx.innerHTML=""; });
}
function freezeAttack(t){
  sHit();
  let ice=""; for(let i=0;i<5;i++) ice+=`<div class="ice" style="left:${10+i*18}%; top:${20+ (i%2)*40}%">❄️</div>`;
  t.fx.innerHTML = `<div class="fx-freeze">${ice}<div class="txt">🧊 急凍！動不了</div></div>`;
  t.fx.classList.add("show");
  t.run.classList.add("dizzy");
  // 冰凍固定 3 秒
  freezeTarget(t, 3000, ()=>{ t.fx.classList.remove("show"); t.fx.innerHTML=""; t.run.classList.remove("dizzy"); });
}
function bananaAttack(t){
  sHit();
  t.combo=0;
  t.pos=Math.max(0, t.pos-2);   // 滑倒後退2格
  moveRunner(t); updateScore();
  t.run.classList.remove("slip"); void t.run.offsetWidth; t.run.classList.add("slip");
  burst(t, "🍌");
  t.fx.innerHTML = `<div class="fx-storm"><div class="txt">🍌 踩到香蕉！倒退兩步</div></div>`;
  t.fx.classList.add("show");
  setTimeout(()=>{ t.fx.classList.remove("show"); t.fx.innerHTML=""; t.run.classList.remove("slip"); }, 1400);
}
function stormAttack(t){
  sHit();
  t.combo=0;
  t.pos=Math.max(0, t.pos-3);   // 龍捲風後退3格
  moveRunner(t); updateScore();
  t.run.classList.add("dizzy");
  burst(t, "🌪️");
  t.fx.innerHTML = `<div class="fx-storm"><div class="txt">🌪️ 龍捲風！被吹退三步</div></div>`;
  t.fx.classList.add("show");
  freezeTarget(t, 1600, ()=>{ t.fx.classList.remove("show"); t.fx.innerHTML=""; t.run.classList.remove("dizzy"); });
}

// ===== 粒子噴發 =====
function burst(p, emoji){
  const rect=p.run.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const el=document.createElement("div");
    el.className="particle"; el.textContent=emoji;
    el.style.left=(rect.left+rect.width/2)+"px";
    el.style.top=(rect.top+rect.height/2)+"px";
    document.body.appendChild(el);
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*60;
    el.animate(
      [{transform:"translate(0,0) scale(1)",opacity:1},
       {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`,opacity:0}],
      {duration:600+Math.random()*300, easing:"ease-out"});
    setTimeout(()=>el.remove(),1000);
  }
}

// ===== 鍵盤 =====
document.addEventListener("keydown", e=>{
  if(!running) return;
  const k=e.key.toLowerCase();
  for(const id of [1,2]){
    const p=P[id];
    if(k===p.power){ usePower(p); continue; }
    const idx=p.keys.indexOf(k);
    if(idx>=0){ const btn=p.opts.children[idx]; if(btn) answer(p,+btn.dataset.val,btn); }
  }
});
$("pw1").onclick=()=>usePower(P[1]);
$("pw2").onclick=()=>usePower(P[2]);
$("audioBtn").onclick=()=>{
  musicOn=!musicOn;
  const b=$("audioBtn");
  b.textContent=musicOn?"♫ 音樂開":"♫ 音樂關";
  b.classList.toggle("off",!musicOn);
  if(musicOn) startMusic();
};

// ===== 流程 =====
function resetPlayer(p){
  p.pos=0; p.energy=0; p.combo=0; p.frozen=false; p.powerReady=false;
  p.run.style.left="0px"; p.run.className="runner"; p.imgEl.src=p.img;
  p.enWrap.classList.remove("full"); p.pw.classList.remove("ready");
  p.pw.textContent="大招 "+(p.id===1?"G":"H");
  p.fx.classList.remove("show"); p.fx.innerHTML=""; p.pct.textContent="0%";
  updateEnergy(p);
}
function startGame(){
  startMusic();
  resetPlayer(P[1]); resetPlayer(P[2]);
  updateScore(); makeQ(P[1]); makeQ(P[2]);
  startSec.style.display="none"; gameSec.classList.add("show");
  let n=3; countBox.classList.add("show"); $("countNum").textContent=n; beep(440,.15);
  const iv=setInterval(()=>{
    n--;
    if(n===0){ $("countNum").textContent="衝！"; beep(880,.3); }
    else if(n<0){ clearInterval(iv); countBox.classList.remove("show"); running=true; }
    else{ $("countNum").textContent=n; beep(440,.15); }
  },1000);
}
function win(p){
  running=false; sWin();
  $("winImg").src=p.img;
  $("overWho").textContent=p.name+" 獲勝！";
  $("overStat").textContent=`最終比分　🦅 ${Math.min(P[1].pos,cfg.laneLen)}　:　${Math.min(P[2].pos,cfg.laneLen)} 🔧`;
  overBox.classList.add("show"); confetti();
}
function confetti(){
  const emo=["🎉","🎊","⭐","🏆","✨","🥇","🎈"];
  for(let i=0;i<50;i++){
    const el=document.createElement("div"); el.className="confetti";
    el.textContent=emo[Math.floor(Math.random()*emo.length)];
    el.style.left=Math.random()*100+"vw"; el.style.fontSize=(18+Math.random()*26)+"px";
    document.body.appendChild(el);
    const dur=1.8+Math.random()*1.8;
    el.animate([{transform:"translateY(0) rotate(0)",opacity:1},
      {transform:`translateY(105vh) rotate(${Math.random()*720-360}deg)`,opacity:1}],
      {duration:dur*1000, easing:"ease-in"});
    setTimeout(()=>el.remove(),dur*1000);
  }
}
function quit(){ running=false; gameSec.classList.remove("show"); overBox.classList.remove("show"); startSec.style.display="flex"; }

$("startBtn").onclick=startGame;
$("againBtn").onclick=()=>{ overBox.classList.remove("show"); startGame(); };
$("quitBtn").onclick=quit;
</script>
</body>
</html>
