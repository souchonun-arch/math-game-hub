<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>"森林測量 · 毫米與分米"</title>
<style>
:root{--bg:#0b1020;--panel:#141c33;--line:#26325a;--txt:#eaf1ff;--sub:#8fa3c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,#182342,#0b1020 72%);
  color:var(--txt);font:16px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:18px;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:430px;background:var(--panel);border:2px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 20px 54px rgba(0,0,0,.55);text-align:center}
.cover{height:148px;position:relative;background:#0e1730;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:46px}
.body{padding:22px 20px 26px}
h1{margin:0 0 8px;font-size:19px;line-height:1.4}
p{margin:0;color:var(--sub);font-size:14px;line-height:1.65}
.lock{font-size:42px;line-height:1;margin-bottom:8px;display:inline-block;
  animation:sw 1.7s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-3px)}}
.spin{width:26px;height:26px;margin:0 auto 12px;border:3px solid #2b3a63;
  border-top-color:#ffb020;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-block;margin-top:16px;color:var(--sub);font-size:13px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.lock,.spin{animation:none}}
</style>
</head>
<body>
<div class="box">
  <div class="cover">
    <img id="cv" alt="">
    <div class="ph" id="ph">🎮</div>
  </div>
  <div class="body" id="body"><div class="spin"></div><p>檢查緊…</p></div>
</div>
<script>
var SEC = "p3", SLUG = "mm-dm-measure", TITLE = "森林測量 · 毫米與分米";
var done = false;
var cv = document.getElementById('cv');
cv.onerror = function () { cv.style.display = 'none'; document.getElementById('ph').style.display = 'flex'; };
cv.src = '../../../assets/img/' + SLUG + '.jpg';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function show(html) { document.getElementById('body').innerHTML = html; }

/* 三層判定：個別遊戲 > 分區 > 全站（缺省 = 開放） */
function isOpen(cfg) {
  var v = cfg.games && cfg.games[SLUG];
  if (v === true || v === false) return v;
  v = cfg.sections && cfg.sections[SEC];
  if (v === true || v === false) return v;
  return cfg.all !== false;
}
function go() { location.replace('play.html'); }
function failOpen() {
  if (done) return;
  done = true;
  show('<h1>網絡唔太穩定</h1><p>3 秒後照樣繼續，唔阻住你玩…</p>');
  setTimeout(go, 3000);
}
function locked(msg) {
  show('<div class="lock">🔒</div><h1>' + esc(msg || '老師仲未開放呢個遊戲') + '</h1>' +
       '<p>上堂嗰陣老師一撳掣就開，到時再嚟玩啦！</p>' +
       '<a class="back" href="../../../">← 返去遊戲總站</a>');
}

fetch('../../../data/open.json', { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw 0; return r.json(); })
  .then(function (cfg) {
    done = true;
    if (isOpen(cfg)) {
      show('<h1>準備中…</h1><p>' + esc(TITLE) + '</p>');
      setTimeout(go, 250);
    } else {
      locked(cfg.message);
    }
  })
  .catch(failOpen);

/* 4 秒都讀唔到設定 → 當開放，保證上堂唔會卡住 */
setTimeout(failOpen, 4000);
</script>
</body>
</html>
